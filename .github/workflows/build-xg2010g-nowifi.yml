name: Build XG2010G AN7581 NOWIFI

on:
  workflow_dispatch:
  push:
    branches:
      - xg2010g-nowifi-profile
    paths:
      - 'Makefile'
      - 'npu_config.h'
      - 'npu_*.c'
      - 'npu_*.h'
      - 'crt0.S'
      - 'link.ld'
      - 'docs/xg2010g.md'
      - '.github/workflows/build-xg2010g-nowifi.yml'

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install RISC-V bare-metal toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-unknown-elf binutils-riscv64-unknown-elf

      - name: Build XG2010G profile
        run: |
          make clean
          make xg2010g-nowifi
          test -s build/AN7581_XG2010G_NOWIFI/npu_rv32.bin
          test -s build/AN7581_XG2010G_NOWIFI/npu_data.bin
          make SOC=AN7581 WIFI=NOWIFI BOARD=XG2010G disasm
          riscv64-unknown-elf-size build/AN7581_XG2010G_NOWIFI/firmware.elf
          strings build/AN7581_XG2010G_NOWIFI/npu_rv32.bin | grep -F 'NOWIFI.XG2010G'

      - name: Verify profile guard
        shell: bash
        run: |
          set -euo pipefail
          make clean
          if make SOC=AN7583 WIFI=NOWIFI BOARD=XG2010G; then
            echo "ERROR: XG2010G profile incorrectly built for AN7583" >&2
            exit 1
          fi

      - name: Rebuild final artifact
        run: |
          make clean
          make xg2010g-nowifi
          sha256sum             build/AN7581_XG2010G_NOWIFI/npu_rv32.bin             build/AN7581_XG2010G_NOWIFI/npu_data.bin             > build/AN7581_XG2010G_NOWIFI/SHA256SUMS

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: ClankerNPU-AN7581-XG2010G-NOWIFI
          path: |
            build/AN7581_XG2010G_NOWIFI/npu_rv32.bin
            build/AN7581_XG2010G_NOWIFI/npu_data.bin
            build/AN7581_XG2010G_NOWIFI/firmware.elf
            build/AN7581_XG2010G_NOWIFI/firmware.map
            build/AN7581_XG2010G_NOWIFI/SHA256SUMS
          retention-days: 7
